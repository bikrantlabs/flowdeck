services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: flowdeck
      POSTGRES_USER: flowdeck
      POSTGRES_PASSWORD: flowdeck_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdeck -d flowdeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://flowdeck:flowdeck_dev_only@db:5432/flowdeck?schema=public"
      DIRECT_URL: "postgresql://flowdeck:flowdeck_dev_only@db:5432/flowdeck?schema=public"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
  postgres_data:
